name: Go

permissions:
  contents: read

on:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: read
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Go 1.25
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.25'
        cache: false

    - name: Get dependencies
      run: go get -v -t -d ./...

    - name: Build (Smoke test)
      run: CGO_ENABLED=0 go build -v ./...

    - name: Test
      run: CGO_ENABLED=0 go test -v ./...

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Releases
      run: |
        # Platforms that REQUIRE Cgo (because they need libfuse) will be compiled with xgo.
        # This produces builds at:
        # - ./bin/pang-darwin-amd64
        # - ./bin/pang-darwin-arm64
        bash ci/xgo/xgo-build.sh ghcr.io/pangbox/pangfiles/xgo:bd83ed073fc2b89295f13375583f7be6592ac8e0

        # Other platforms that do not require Cgo (because they prefer go-fuse or WinFSP over libfuse) are cross compiled natively.
        CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 go build -o bin/pang-freebsd-amd64 ./cmd/pang
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/pang-linux-amd64 ./cmd/pang
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o bin/pang-windows-amd64.exe ./cmd/pang

    - name: Upload builds
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: bin
        path: bin/*

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        version: v2.13.2

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    steps:
    - name: Download builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: bin
        path: bin

    - name: Zip builds
      run: |
        for i in bin/*
        do
          OUT="$PWD/$(basename "$i").zip"
          cd "$(dirname "$i")"
          zip "$OUT" "$(basename "$i")"
          cd -
        done

    - name: Create Release
      run: >-
        gh release create "$GITHUB_REF_NAME"
        --draft
        --generate-notes
        pang-macos-amd64.zip
        pang-macos-arm64.zip
        pang-freebsd-amd64.zip
        pang-linux-amd64.zip
        pang-windows-amd64.exe.zip
      env:
        GH_TOKEN: ${{ github.token }}
